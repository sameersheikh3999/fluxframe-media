[project]
name = "fluxframe-backend"
version = "0.1.0"
description = "Fluxframe Media — application backend (FastAPI modular monolith)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    # [email] pulls in email-validator, which EmailStr needs. Validating an
    # address properly at the edge is cheaper than storing a bad one forever.
    "pydantic[email]>=2.9",
    "pydantic-settings>=2.6",
    "structlog>=24.4",
    "sqlalchemy[asyncio]>=2.0.36",
    "alembic>=1.14",
    # psycopg 3 gives us sync AND async from one package behind one URL scheme,
    # which is why Alembic can stay synchronous while the app runs async.
    "psycopg[binary]>=3.2",
    "httpx>=0.27",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "mypy>=1.13",
    "import-linter>=2.1",
    # Integration tests run against SQLite so the suite needs no database server.
    # The ORM uses portable column types with PostgreSQL variants, so the same
    # models drive both. See docs/testing.md.
    "aiosqlite>=0.20",
    # Records/mocks httpx traffic: lets us test every HubSpot and Anthropic
    # failure mode without a network or an API key.
    "respx>=0.21",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

# ---------------------------------------------------------------------------
# Ruff — linting + formatting
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["app", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "N",        # pep8-naming
    "UP",       # pyupgrade
    "B",        # flake8-bugbear
    "C4",       # flake8-comprehensions
    "SIM",      # flake8-simplify
    "TID",      # flake8-tidy-imports
    "RUF",      # ruff-specific
    "ANN",      # flake8-annotations — every function is typed
    "ASYNC",    # flake8-async
]
ignore = [
    "ANN401",   # allow typing.Any where genuinely needed (exception handlers)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.isort]
known-first-party = ["app", "tests"]

# ---------------------------------------------------------------------------
# mypy
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
show_error_codes = true
pretty = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# The inner layers are held to the strictest standard because they contain
# the rules we care about most. Adapters may relax this later if a third-party
# library ships poor stubs.
module = ["app.domain.*", "app.application.*"]
disallow_any_explicit = true

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q --strict-markers"
markers = [
    "unit: no I/O of any kind — pure functions and in-memory fakes",
    "integration: touches a real external system (database, HTTP)",
]
